<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Трудомикс — анимация загрузки</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color-scheme:dark;--bg:#101419;--fg:#f3f5fa;--panel:#1b212b;--stroke:#303847;--accent:#8b52ff;--muted:#94a0b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center;transition:background .3s,color .3s}body.light{--bg:#f6f8fc;--fg:#151b29;--panel:#fff;--stroke:#d9e0eb;--muted:#69768a;color-scheme:light}
.shell{width:min(92vw,780px);padding:24px}.header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 0 8px}.hint{font-size:13px;color:var(--muted);margin:0 0 20px}.stage{position:relative;height:min(57vh,460px);min-height:330px;border:1px solid var(--stroke);border-radius:28px;background:var(--panel);display:grid;place-items:center;overflow:hidden;isolation:isolate}.stage:before,.stage:after{content:'';position:absolute;border:1px solid color-mix(in srgb,var(--accent),transparent 65%);border-radius:50%;width:370px;height:250px;transform:rotate(-28deg);opacity:.38;pointer-events:none}.stage:after{width:440px;height:330px;transform:rotate(28deg);opacity:.2}.decor{position:absolute;inset:0;pointer-events:none}.decor svg{width:100%;height:100%}.decor path{stroke:var(--accent);fill:none;stroke-width:1.5;opacity:.5;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 2.2s ease forwards}.decor circle,.decor polygon{fill:var(--accent);opacity:.65;animation:float 3s ease-in-out infinite alternate}.logo-wrap{display:flex;flex-direction:column;align-items:center;z-index:2;gap:16px}.logo{width:116px;height:116px;object-fit:contain;animation:logo-in .85s cubic-bezier(.2,.9,.2,1) both}.name{font-size:24px;font-weight:750;letter-spacing:-.6px;animation:fade-up .8s .18s both}.status{font-size:12px;color:var(--muted);animation:fade-up .8s .28s both}.progress{height:3px;width:190px;border-radius:8px;background:var(--stroke);overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);animation:fill 3s ease-in-out forwards}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:18px}label{display:grid;gap:6px;font-size:12px;color:var(--muted)}select,button{background:var(--panel);color:var(--fg);border:1px solid var(--stroke);border-radius:10px;padding:10px 12px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}.foot{font-size:12px;color:var(--muted);margin-top:14px}
@keyframes logo-in{from{opacity:0;transform:translateY(18px) scale(.82) rotate(-7deg)}to{opacity:1;transform:none}}@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fill{0%{width:0}65%{width:74%}100%{width:100%}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes float{to{transform:translateY(-9px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main class="shell"><h1>Трудомикс · Загрузка</h1><p class="hint">Интерактивное превью для сайта и Android · выбранная иконка и тема сохраняются</p><section class="stage" id="stage" aria-label="Предпросмотр анимации загрузки"><div class="decor"><svg viewBox="0 0 700 430" preserveAspectRatio="xMidYMid slice"><path d="M-50 310 C110 180 185 365 350 240 S560 85 760 165"/><path d="M-30 345 C145 235 220 400 405 280 S590 125 735 210"/><circle cx="112" cy="135" r="5"/><circle cx="588" cy="295" r="4"/><polygon points="565,92 569,104 581,108 569,112 565,124 561,112 549,108 561,104"/><polygon points="165,330 168,337 175,340 168,343 165,350 162,343 155,340 162,337"/></svg></div><div class="logo-wrap"><img id="logo" class="logo" src="icons/icon_01_transparent.png" alt="Логотип Трудомикс"><div class="name">Трудомикс</div><div class="status">Подбираем возможности для вас</div><div class="progress"><div></div></div></div></section><div class="controls"><label>Логотип<select id="variant"></select></label><label>Цвет иконки<select id="color"></select></label><label>Тема<select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label><button id="replay">↻ Повторить анимацию</button></div><p class="foot">Для реального приложения скрывайте экран по завершении инициализации, а не по фиксированному таймеру. Текущий прогресс — демонстрационный.</p></main><script>
const colors=['transparent','blue','violet','navy','white','mint','coral','cream','black'];const colorNames=['Без фона','Синий','Фиолетовый','Тёмно-синий','Белый','Мятный','Коралловый','Кремовый','Чёрный'];const $=id=>document.getElementById(id);for(let i=1;i<=9;i++)$('variant').add(new Option('Вариант '+i,String(i)));colors.forEach((c,i)=>$('color').add(new Option(colorNames[i],c)));
function restart(){const stage=$('stage'), clone=stage.cloneNode(true);stage.replaceWith(clone);clone.querySelector('#logo').src=`icons/icon_${$('variant').value.padStart(2,'0')}_${$('color').value}.png`;document.documentElement.style.setProperty('--accent',({'blue':'#248bff','violet':'#8651f7','navy':'#566bc7','mint':'#14b8a6','coral':'#ff6b69','cream':'#d7a746','black':'#666','white':'#8b52ff','transparent':'#8b52ff'})[$('color').value]);}
function update(){document.body.classList.toggle('light',$('theme').value==='light');localStorage.setItem('trudomix-loader-settings',JSON.stringify({variant:$('variant').value,color:$('color').value,theme:$('theme').value}));restart()}
try{const s=JSON.parse(localStorage.getItem('trudomix-loader-settings')||'{}');$('variant').value=s.variant||'1';$('color').value=s.color||'transparent';$('theme').value=s.theme||'dark'}catch{};['variant','color','theme'].forEach(id=>$(id).addEventListener('change',update));$('replay').addEventListener('click',restart);update();
</script></body></html>
