services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: gohh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gohh"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DOCKER_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gohh?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gohh?sslmode=disable}
      HTTP_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      APP_ENV: ${APP_ENV:-production}
      OTP_MODE: ${OTP_MODE:-off}
      OTP_SECRET: ${OTP_SECRET:-}
      OTP_TEST_PHONES: ${OTP_TEST_PHONES:-}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://host.docker.internal:8000}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    restart: unless-stopped

  uploads-init:
    image: alpine:3.22
    command: ["sh", "-ec", "cp -an /source/. /data/; chown -R 10001:10001 /data"]
    volumes:
      - type: bind
        source: ./uploads
        target: /source
        read_only: true
      - uploads_data:/data
    restart: "no"

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
