<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трудомикс — выбор анимации загрузки</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0a13;color:#f7f5ff;font-family:Inter,system-ui,Arial,sans-serif}.app{max-width:1160px;margin:auto;padding:28px 20px}h1{font-size:clamp(24px,3vw,36px);margin:0 0 8px}p{color:#aaa5c0;margin:0 0 24px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}.choices{display:flex;flex-direction:column;gap:9px}.choice{border:1px solid #353047;background:#171421;color:#fff;border-radius:15px;display:flex;align-items:center;gap:16px;padding:14px;text-align:left;cursor:pointer;transition:.2s}.choice:hover{border-color:#8d67ee}.choice.active{background:#29203d;border-color:#b88aff;box-shadow:inset 3px 0 #b78aff}.choice b{font-size:14px}.choice small{display:block;color:#a9a3bb;font-size:11px;margin-top:4px;line-height:1.35}.num{color:#ae83f8;font-weight:800;font-size:19px}.preview{border:1px solid #373047;border-radius:20px;overflow:hidden;background:#0b0a17}.bar{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;gap:12px;flex-wrap:wrap;background:#171321}.bar strong{font-size:14px}.actions{display:flex;gap:8px}button.control{cursor:pointer;border:1px solid #5b4d78;border-radius:9px;background:#292239;color:#fff;padding:9px 12px}.control:hover{background:#42335d}.scene{height:490px;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 55%,#201638 0%,#0b0a17 65%);isolation:isolate}.scene.light{background:radial-gradient(ellipse at 50% 55%,#f2eaff 0%,#f8f7fd 72%);color:#16112b}.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,rgba(174,95,255,.22),transparent 60%);opacity:0}.scene .core{position:relative;width:min(66%,310px);z-index:2;display:flex;align-items:center;flex-direction:column}.logo{width:100%;overflow:visible;filter:drop-shadow(0 8px 15px #0003)}.letter{fill:url(#t)}.light .letter{fill:url(#tl)}.orb{fill:url(#o)}.outline{fill:none;stroke:#bd84ff;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}.word{letter-spacing:.36em;font-size:15px;font-weight:750;margin:14px 0 0 6px;opacity:0}.light .word{color:#20133e}.ring{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-75px;border:2px solid #b76aff;border-radius:50%;opacity:0;pointer-events:none;box-shadow:0 0 30px #8b4cff}.sweep{position:absolute;inset:0;opacity:0;pointer-events:none;background:linear-gradient(to bottom,transparent 43%,#a56bff55 50%,transparent 57%)}.shutter{display:none;position:absolute;z-index:4;left:0;right:0;height:50%;background:linear-gradient(160deg,#1d1432,#0e0c1c);box-shadow:0 0 30px #8d55ff44}.shutterStyle .shutter{display:block}.shutter.top{top:0}.shutter.bottom{bottom:0}.light .shutter{background:linear-gradient(160deg,#e2d7f8,#f4edff)}.particles{position:absolute;inset:0;z-index:3;pointer-events:none}.particle{position:absolute;width:4px;height:4px;background:#d7a8ff;border-radius:50%;left:var(--x);top:var(--y);box-shadow:0 0 10px #b46cff;opacity:0}.scene.play .word{animation:word 1s ease 2.6s forwards}@keyframes word{to{opacity:1}}@keyframes trace{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes impact{0%,100%{opacity:0;transform:scale(.5)}15%{opacity:.9}90%{opacity:0;transform:scale(5)}}@keyframes ambient{0%,100%{opacity:0}35%{opacity:1}}@keyframes flash{0%,100%{filter:drop-shadow(0 0 0 #a869ff00)}45%{filter:drop-shadow(0 0 32px #b66cff)}}@keyframes flicker{0%{opacity:0}25%{opacity:1}33%{opacity:.15}50%{opacity:1}63%{opacity:.3}100%{opacity:1}}@keyframes topOpen{to{transform:translateY(-103%)}}@keyframes bottomOpen{to{transform:translateY(103%)}}@keyframes gather{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}35%{opacity:1}80%{opacity:0;transform:translate(0,0) scale(.2)}100%{opacity:0}}@keyframes zoom{0%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.12)}68%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}@keyframes sweep{0%{opacity:1;transform:translateY(-110%)}100%{opacity:1;transform:translateY(110%)}}@keyframes revealScan{from{clip-path:inset(100% 0 0)}to{clip-path:inset(0 0 0)}}
/* Each style has its own motion language, not a recolored copy. */
.impact.play .letter,.impact.play .orb{opacity:0;animation:fade .5s ease 1.5s forwards}.impact.play .letter-line{animation:trace 1.65s ease forwards}.impact.play .orb-line{animation:trace .8s ease 1.1s forwards}.impact.play .ring{animation:impact 1.35s ease-out 2s forwards}.impact.play:after{animation:ambient 1.5s ease 2s}.impact.play .core{animation:flash 1.4s ease 1.95s}
.neon .letter,.neon .orb{opacity:0}.neon .outline{stroke:#dcacff;filter:drop-shadow(0 0 10px #bd66ff)}.neon.play .letter-line{animation:trace 1.5s linear forwards}.neon.play .orb-line{animation:trace 1.3s linear .25s forwards}.neon.play .letter,.neon.play .orb{animation:flicker .85s steps(1,end) 1.65s forwards}.neon.play .core{animation:flash 2s ease 1.7s}
.shutterStyle .outline,.particlesStyle .outline,.pulseStyle .outline,.scanStyle .outline{display:none}.shutterStyle .letter,.shutterStyle .orb{opacity:1}.shutterStyle.play .top{animation:topOpen 1.3s cubic-bezier(.65,0,.2,1) .5s forwards}.shutterStyle.play .bottom{animation:bottomOpen 1.3s cubic-bezier(.65,0,.2,1) .5s forwards}.shutterStyle.play .core{animation:flash 1.5s ease 1.5s}
.particlesStyle .letter,.particlesStyle .orb{opacity:0}.particlesStyle.play .letter,.particlesStyle.play .orb{animation:fade .7s ease 1.8s forwards}.particlesStyle.play .particle{animation:gather 2.2s cubic-bezier(.2,.7,.3,1) var(--delay) forwards}.particlesStyle.play .core{animation:flash 1.2s ease 2.1s}
.pulseStyle .letter,.pulseStyle .orb{opacity:1}.pulseStyle .core{opacity:0}.pulseStyle.play .core{animation:zoom 1.65s cubic-bezier(.2,.8,.2,1) forwards}.pulseStyle.play .ring.one{animation:impact 1.3s ease-out 1.4s forwards}.pulseStyle.play .ring.two{animation:impact 1.3s ease-out 1.9s forwards}.pulseStyle.play .ring.three{animation:impact 1.3s ease-out 2.4s forwards}
.scanStyle .letter,.scanStyle .orb{opacity:1}.scanStyle .core{clip-path:inset(100% 0 0)}.scanStyle.play .core{animation:revealScan 2s linear .3s forwards}.scanStyle.play .sweep{animation:sweep 2s linear .3s forwards}.scanStyle.play .core .logo{filter:drop-shadow(0 0 12px #9857ff)}
@media(max-width:750px){.layout{grid-template-columns:1fr}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.scene{height:390px}.app{padding:20px 12px}.choice{padding:10px;gap:8px}.choice small{font-size:10px}}@media(prefers-reduced-motion:reduce){.scene.play *{animation-duration:.01ms!important;animation-delay:0ms!important}}

/* 04: Iris aperture — a circular window grows from the center, with a thin luminous rim */
.particlesStyle .particles,.particlesStyle .sweep{display:none!important}
.particlesStyle .letter,.particlesStyle .orb{opacity:1!important;animation:none!important}
.particlesStyle .core{opacity:1;clip-path:circle(0% at 50% 46%);animation:none!important}
.particlesStyle.play .core{animation:irisOpen 2.15s cubic-bezier(.17,.75,.25,1) .15s forwards!important}
.particlesStyle .ring{display:none}
.particlesStyle .ring.one{display:block;width:14px;height:14px;margin:-7px;border-width:3px;top:47%;box-shadow:0 0 18px #bb70ff,0 0 45px #8d45ff}
.particlesStyle.play .ring.one{animation:irisRim 2.25s ease-out .12s forwards!important}
.particlesStyle.play:after{animation:ambient 1.6s ease 1.4s both}
@keyframes irisOpen{0%{clip-path:circle(0% at 50% 46%)}35%{clip-path:circle(16% at 50% 46%)}100%{clip-path:circle(80% at 50% 46%)}}
@keyframes irisRim{0%{opacity:0;transform:scale(1)}20%{opacity:.95}72%{opacity:.7}100%{opacity:0;transform:scale(30)}}
/* 05: Independent orb trajectory — the T is static while the purple orb arrives on a curved path */
.pulseStyle .ring,.pulseStyle .sweep{display:none!important}
.pulseStyle .core{opacity:1;transform:none;filter:none;animation:none!important}
.pulseStyle .letter{opacity:0;animation:none!important}
.pulseStyle.play .letter{animation:letterReveal .85s ease-out .15s forwards!important}
.pulseStyle .orb{opacity:0;transform-box:fill-box;transform-origin:center;animation:none!important}
.pulseStyle.play .orb{animation:orbArrive 2.2s cubic-bezier(.2,.72,.18,1) .35s forwards!important}
.pulseStyle.play .core .logo{animation:finalShimmer 1.2s ease 2.45s both}
.pulseStyle.play:after{animation:ambient 1.25s ease 2.25s both}
@keyframes letterReveal{0%{opacity:0;filter:blur(14px)}100%{opacity:1;filter:blur(0)}}
@keyframes orbArrive{0%{opacity:0;transform:translate(250px,-330px) scale(.25)}18%{opacity:1}42%{transform:translate(120px,-180px) scale(.75)}72%{transform:translate(-25px,22px) scale(1.12)}85%{transform:translate(8px,-8px) scale(.96)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes finalShimmer{0%{filter:drop-shadow(0 0 0 transparent)}45%{filter:drop-shadow(0 0 22px #a75bff)}100%{filter:drop-shadow(0 0 4px #a75bff44)}}

/* 04 — digital engraving: rapid laser hatch with no iris or circular reveal */
.particlesStyle .core{clip-path:none!important;opacity:1!important;animation:none!important;filter:none!important}
.particlesStyle .letter,.particlesStyle .orb{opacity:0;animation:none!important}
.particlesStyle.play .letter,.particlesStyle.play .orb{animation:engraveAppear 1.8s steps(14,end) .4s forwards!important}
.particlesStyle .engrave-lines{display:block;position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,transparent 0px,transparent 9px,rgba(201,153,255,.9) 10px,transparent 12px);mask-image:linear-gradient(180deg,transparent 0%,black 25%,black 75%,transparent 100%);mix-blend-mode:screen}
.particlesStyle.play .engrave-lines{animation:engraveSweep 2.15s cubic-bezier(.3,.7,.2,1) .2s forwards!important}
.particlesStyle .ring,.particlesStyle .particles{display:none!important}
.particlesStyle.play:after{animation:ambient 1s ease 2s both!important}
@keyframes engraveAppear{0%{opacity:0;filter:brightness(3)}70%{opacity:.8;filter:brightness(2)}100%{opacity:1;filter:brightness(1)}}
@keyframes engraveSweep{0%{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(-45px)}15%{opacity:1}75%{opacity:1}100%{opacity:0;clip-path:inset(0 0 0 0);transform:translateY(45px)}}
/* 05 — liquid metal: irregular wavefront and molten highlights */
.pulseStyle .core{opacity:1!important;animation:none!important;transform:none!important;clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}
.pulseStyle.play .core{animation:liquidReveal 2.45s cubic-bezier(.2,.8,.2,1) .3s forwards!important}
.pulseStyle .letter,.pulseStyle .orb{opacity:1!important;animation:none!important}
.pulseStyle.play .letter,.pulseStyle.play .orb{animation:none!important}
.pulseStyle .liquid-wipe{display:block;position:absolute;z-index:4;left:-30%;right:-30%;height:60px;top:110%;opacity:0;pointer-events:none;background:linear-gradient(0deg,transparent,#b35aff35 30%,#e2b5ffab 55%,transparent);filter:blur(15px);transform:rotate(-13deg)}
.pulseStyle.play .liquid-wipe{animation:liquidLine 2.25s ease-in-out .25s forwards}
.pulseStyle .ring{display:none!important}
.pulseStyle.play:after{animation:ambient 1.4s ease 2.2s both!important}
@keyframes liquidReveal{0%{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%);filter:blur(8px) brightness(2)}25%{clip-path:polygon(0 87%,30% 78%,65% 90%,100% 76%,100% 100%,0 100%)}55%{clip-path:polygon(0 50%,25% 60%,55% 39%,78% 53%,100% 37%,100% 100%,0 100%)}80%{clip-path:polygon(0 20%,28% 9%,53% 17%,76% 5%,100% 14%,100% 100%,0 100%)}100%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);filter:blur(0) brightness(1)}}
@keyframes liquidLine{0%{opacity:0;top:110%}15%{opacity:.85}85%{opacity:.85}100%{opacity:0;top:-20%}}
</style></head><body><main class="app"><h1>Выбор анимации загрузки</h1><p>Три разных стиля загрузки. Выбери стиль — он сохранится для следующего открытия.</p><div class="layout"><nav class="choices"><button class="choice" data-style="impact"><span class="num">01</span><span><b>Контур + импульс</b><small>Прорисовка, фиксация и волна по экрану</small></span></button><button class="choice" data-style="neon"><span class="num">02</span><span><b>Неоновая сборка</b><small>Светящиеся линии и электрический разряд</small></span></button><button class="choice" data-style="shutter"><span class="num">03</span><span><b>Световые створки</b><small>Две световые панели открывают знак</small></span></button></nav><section class="preview"><div class="bar"><strong id="selected">Контур + импульс</strong><div class="actions"><button class="control" id="theme">☀ Светлая тема</button><button class="control" id="replay">↻ Повтор</button></div></div><div class="scene impact" id="scene"><div class="shutter top"></div><div class="shutter bottom"></div><div class="particles" id="particles"></div><div class="sweep"></div><div class="ring one"></div><div class="ring two"></div><div class="ring three"></div><div class="engrave-lines"></div><div class="liquid-wipe"></div><div class="core"><svg class="logo" viewBox="0 0 1000 850" aria-label="Логотип Трудомикс"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ded4ff"/></linearGradient><linearGradient id="tl" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11102e"/><stop offset="1" stop-color="#5540cf"/></linearGradient><linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e49cff"/><stop offset=".5" stop-color="#a545fb"/><stop offset="1" stop-color="#4a16d7"/></linearGradient></defs><path class="letter" d="M 955.19 55.80 Q 948.89 48.78 943.33 45.46 Q 937.78 42.13 929.26 40.28 Q 920.74 38.43 575.19 38.43 Q 229.63 38.43 210.00 41.76 Q 190.37 45.09 170.37 52.85 Q 150.37 60.61 const labels={impact:'Контур + импульс',neon:'Неоновая сборка',shutter:'Световые створки'};const classes={impact:'impact',neon:'neon',shutter:'shutterStyle'};const scene=document.querySelector('#scene');const choices=[...document.querySelectorAll('.choice')];let current=localStorage.getItem('trudomix-style')||'impact';if(!labels[current])current='impact';let light=localStorage.getItem('trudomix-light')==='true';function play(){scene.classList.remove('play');void scene.offsetWidth;scene.classList.add('play')}function select(id){current=id;localStorage.setItem('trudomix-style',id);scene.className='scene '+classes[id]+(light?' light':'');document.querySelector('#selected').textContent=labels[id];choices.forEach(b=>b.classList.toggle('active',b.dataset.style===id));play()}choices.forEach(b=>b.addEventListener('click',()=>select(b.dataset.style)));document.querySelector('#replay').onclick=play;document.querySelector('#theme').onclick=()=>{light=!light;localStorage.setItem('trudomix-light',String(light));document.querySelector('#theme').textContent=light?'☾ Тёмная тема':'☀ Светлая тема';select(current)};document.querySelector('#theme').textContent=light?'☾ Тёмная тема':'☀ Светлая тема';select(current);
</script></body></html>
