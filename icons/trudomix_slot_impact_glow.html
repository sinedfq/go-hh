<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трудомикс — эффект установки в слот</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif}body{background:#080816;color:#fff}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 22px;background:#181629}.toolbar button{cursor:pointer;border:1px solid #68607c;background:#2c2544;color:#fff;border-radius:22px;padding:9px 14px}.toolbar button.active{background:#8257e6;border-color:#8257e6}.stage{height:calc(100dvh - 76px);min-height:420px;display:flex;align-items:center;justify-content:center;background:#080816;transition:background .3s} .stage.light{background:#f8f7fc}
.stage{position:relative;overflow:hidden;isolation:isolate}
.slot-flash,.slot-ring,.slot-core{position:absolute;pointer-events:none;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;border-radius:50%}
.slot-flash{width:150vmax;height:150vmax;background:radial-gradient(circle,rgba(173,112,255,.32) 0%,rgba(116,75,244,.20) 20%,rgba(90,55,222,.09) 42%,transparent 70%);filter:blur(18px);mix-blend-mode:screen}
.slot-core{width:90vmin;height:90vmin;background:radial-gradient(circle,rgba(220,190,255,.26),rgba(148,96,255,.12) 28%,transparent 69%);filter:blur(20px)}
.slot-ring{width:260px;height:260px;border:2px solid rgba(167,130,255,.6);box-shadow:0 0 30px rgba(148,89,255,.3),inset 0 0 20px rgba(148,89,255,.15)}
.stage.light .slot-flash{background:radial-gradient(circle,rgba(169,120,255,.28),rgba(151,110,242,.12) 32%,transparent 70%);mix-blend-mode:multiply}
.stage.light .slot-core{background:radial-gradient(circle,rgba(166,118,244,.18),transparent 69%)}
.stack{position:static;z-index:2}.logo,.name{position:relative;z-index:2}
.play .slot-flash{animation:slotFlash 2.6s cubic-bezier(.2,.7,.25,1) 6.95s both}
.play .slot-core{animation:slotCore 2.6s ease-out 6.95s both}
.play .slot-ring{animation:slotRing 1.9s cubic-bezier(.14,.55,.25,1) 7.02s both}
.play .logo{animation:slotDock 1.45s cubic-bezier(.2,.8,.2,1) 6.9s both}
@keyframes slotDock{0%{transform:scale(1)}18%{transform:scale(.935)}38%{transform:scale(.935)}56%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes slotFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.13)}18%{opacity:0}43%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
@keyframes slotCore{0%,20%{opacity:0;transform:translate(-50%,-50%) scale(.15)}45%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
@keyframes slotRing{0%,12%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:.78}100%{opacity:0;transform:translate(-50%,-50%) scale(3.8)}}
.stack{display:flex;flex-direction:column;align-items:center;gap:25px;width:100%}.logo{width:min(55vw,310px);height:auto;overflow:visible}.name{font-weight:800;letter-spacing:.23em;font-size:clamp(16px,2vw,22px);opacity:0;transform:translateY(12px);color:#fff}.light .name{color:#191431}
.outline{fill:none;stroke:#a77aff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 8px rgba(150,83,245,.55))}.letter{opacity:0;fill:url(#darkLetter)}.light .letter{fill:url(#lightLetter)}.orb{opacity:0}.halo{opacity:0;fill:none;stroke:#bca2ff;stroke-width:9;filter:blur(16px)}
.play .letter-line{animation:traceT 4.6s cubic-bezier(.42,0,.24,1) forwards}.play .letter{animation:fillT 1.8s ease 3.5s forwards}.play .orb-line{animation:traceT 1.7s cubic-bezier(.4,0,.2,1) 4.7s forwards}.play .orb{animation:fillT 1.25s ease 5.7s forwards}.play .halo{animation:halo 1.8s ease 7.05s forwards}.play .letter{animation:fillT 1.8s ease 3.5s forwards,logoGlow 1.8s ease 7.05s forwards}.play .orb{animation:fillT 1.25s ease 5.7s forwards,logoGlow 1.8s ease 7.05s forwards}.play .name{animation:name 1.2s ease 6.7s forwards}
@keyframes traceT{to{stroke-dashoffset:0}}@keyframes fillT{to{opacity:1}}@keyframes halo{0%{opacity:0;stroke-width:4}40%{opacity:.72;stroke-width:15}100%{opacity:0;stroke-width:24}}@keyframes logoGlow{0%{filter:drop-shadow(0 0 0 rgba(155,91,255,0))}42%{filter:drop-shadow(0 0 24px rgba(155,91,255,.85))}100%{filter:drop-shadow(0 0 3px rgba(155,91,255,.08))}}@keyframes name{to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.toolbar{padding:12px}.logo{width:min(75vw,300px)}.stage{height:calc(100dvh - 100px)}}

<script>const stage=document.getElementById('stage'),stack=document.getElementById('stack');function replay(){stack.classList.remove('play');void stack.offsetWidth;stack.classList.add('play')}function theme(light){stage.classList.toggle('light',light);document.getElementById('light').classList.toggle('active',light);document.getElementById('dark').classList.toggle('active',!light);replay()}document.getElementById('light').onclick=()=>theme(true);document.getElementById('dark').onclick=()=>theme(false);document.getElementById('replay').onclick=replay;replay();</script></body></html>
